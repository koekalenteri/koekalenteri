  KoekalenteriApi:
    Type: AWS::Serverless::Api
    Properties:
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          DataTraceEnabled: false
          MetricsEnabled: false
          LoggingLevel: INFO
        # A runaway client once drove GET /user to ~11.5 req/s for hours, which was 64% of all
        # Lambda invocations. Legitimate traffic is one call per token-refresh cycle per user,
        # roughly 0.003 req/s in total, so this bucket sits ~1000x above normal use and still
        # trips well below a storm. The bucket is shared across the method, not per caller.
        - ResourcePath: '/user'
          HttpMethod: 'GET'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 20
        # Every route below needs no sign-in, and each has a bucket of its own: without one a route
        # falls back to the account-wide default, the same exposure the /user incident above was
        # about (KOE-1620; src/lambda/template.test.ts fails on a public route without a bucket).
        # Unless a comment says otherwise, the numbers are estimates from how the pages use the
        # route, not measurements. Each bucket is shared by all callers of the method.
        #
        # The public event list and an event's page take the entry-opening peak: everyone who
        # waits for a popular trial's entry loads both, and reloads them, within the same minute.
        # Some hundreds of people in that minute is a few requests a second, so these sit well
        # above it.
        - ResourcePath: '/event'
          HttpMethod: 'GET'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 100
        - ResourcePath: '/event/{id}'
          HttpMethod: 'GET'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 100
        # The entry itself at the same peak (estimate): one dog lookup, one entry and one payment
        # per dog, a handful a second at most. A refresh of the dog reaches Kennelliitto at most
        # once a minute per dog (GetDogFunction).
        - ResourcePath: '/dog/{regNo}'
          HttpMethod: 'GET'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 40
        - ResourcePath: '/registration'
          HttpMethod: 'POST'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 40
        - ResourcePath: '/registration'
          HttpMethod: 'PATCH'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 40
        - ResourcePath: '/registration/{eventId}/{id}'
          HttpMethod: 'GET'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 40
        - ResourcePath: '/payment/create'
          HttpMethod: 'POST'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 40
        - ResourcePath: '/payment/verify'
          HttpMethod: 'POST'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 40
        # Paytrail's server callbacks, and the pages its redirect lands on (paytrail.ts
        # createPaymentCallbackUrls, createRefundCallbackUrls). A payment or refund confirmation
        # must never be the request that is throttled, so these are the widest: twice the event
        # list's, well above any entry-opening peak (estimate).
        - ResourcePath: '/payment/success'
          HttpMethod: 'GET'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 200
        - ResourcePath: '/payment/cancel'
          HttpMethod: 'GET'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 200
        - ResourcePath: '/refund/success'
          HttpMethod: 'GET'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 200
        - ResourcePath: '/refund/cancel'
          HttpMethod: 'GET'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 200
        # An event's attachment (the invitation) and the public statistics are opened now and then,
        # from the event page or a mail (estimate).
        - ResourcePath: '/file/{key}/{name}'
          HttpMethod: 'GET'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 40
        - ResourcePath: '/stats'
          HttpMethod: 'GET'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 20
        # The start list is the page spectators keep open on an event day, so its bucket is the
        # widest of the event-day routes (estimate).
        - ResourcePath: '/startlist/{eventId}'
          HttpMethod: 'GET'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 100
        # A handful of posts per event: legitimate traffic is a save or a reload every few minutes.
        - ResourcePath: '/station-entry/{eventId}/{stationId}'
          HttpMethod: 'GET'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 20
        - ResourcePath: '/station-entry/{eventId}/{stationId}'
          HttpMethod: 'POST'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 20
        - ResourcePath: '/station-entry/{eventId}/{stationId}/turn'
          HttpMethod: 'POST'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 20
        # A class secretary's draw sheet (KOE-1267): a handful of classes per event, loaded once
        # and saved a few times while the numbers are drawn.
        - ResourcePath: '/start-numbers/{eventId}/{eventClass}'
          HttpMethod: 'GET'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 20
        - ResourcePath: '/start-numbers/{eventId}/{eventClass}'
          HttpMethod: 'POST'
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 20

      AccessLogSetting:
        DestinationArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ApiAccessLogGroup}'
        Format: '$context.identity.sourceIp $context.authorizer.claims.sub [$context.requestTime] "$context.httpMethod $context.resourcePath $context.protocol" $context.status $context.requestId $context.awsEndpointRequestId $context.xrayTraceId $context.responseLatency $context.integrationLatency "$context.error.message" "$context.request.header.X-Client-Version"'
      Name: !Join ['-', [Koekalenteri, !Ref AWS::StackName]]
      StageName: !Ref StageNameParam
      OpenApiVersion: '3.0.1' # prevents the default 'Stage' creation
      TracingEnabled: false
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'OPTIONS,HEAD,GET,PUT,POST,PATCH,DELETE'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Amz-Security-Token,X-Client-Version,X-Registration-Token'"
        # Without this the browser preflights every five seconds; one storm episode added
        # 2351 preflight round trips on its own.
        MaxAge: "'3600'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt "KoekalenteriUserPool.Arn"
      BinaryMediaTypes:
        - "multipart/form-data"
        - "application/pdf"
        - "text/html" # default first ACCEPT header for all browsers
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: 401
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        ACCESS_DENIED:
          StatusCode: 403
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        RESOURCE_NOT_FOUND:
          StatusCode: 404
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        REQUEST_TOO_LARGE:
          StatusCode: 413
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          StatusCode: 500
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"

  ApiGatewayPushToCloudWatchRole:
    Type: "AWS::IAM::Role"
    Properties:
      Description: "Push logs to CloudWatch logs from API Gateway"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - "apigateway.amazonaws.com"
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs"

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/AccessLog-${StageNameParam}-${KoekalenteriApi}
      RetentionInDays: 365
