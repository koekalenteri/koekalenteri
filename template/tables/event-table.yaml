  EventTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Join ['-', [event-table, 'v3', !Ref AWS::StackName]]
      KeySchema:
          - AttributeName: id
            KeyType: HASH
      AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: season
            AttributeType: S
          - AttributeName: startDate
            AttributeType: S
          - AttributeName: eventType
            AttributeType: S
          - AttributeName: updatedAt
            AttributeType: S
          - AttributeName: entryEndDate
            AttributeType: S
          - AttributeName: organizerId
            AttributeType: S
      GlobalSecondaryIndexes:
        # A club's administrator reads the club's events and nothing else; before this index every
        # administrator's list was a scan of the whole table filtered in memory (KOE-1341).
        - IndexName: gsiOrganizerStartDate
          KeySchema:
            - AttributeName: organizerId
              KeyType: HASH
            - AttributeName: startDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsiSeasonUpdatedAt
          KeySchema:
            - AttributeName: season
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsiSeasonStartDate
          KeySchema:
            - AttributeName: season
              KeyType: HASH
            - AttributeName: startDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsiEventTypeEntryEndDate
          KeySchema:
            - AttributeName: eventType
              KeyType: HASH
            - AttributeName: entryEndDate
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - origEntryEndDate
              - entryEndDate
      Tags:
        - Key: Env
          Value: !Ref AWS::StackName
        - Key: Label
          Value: "koekalenteri"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
