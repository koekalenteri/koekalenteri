  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/GetUserFunction
      Handler: handler.default
      Layers:
        - !Ref DependenciesLayer
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserLinkTable
        # dataVersions reads the version registry instead of scanning the collection tables.
        # Crud, not Read: authorize() can create or update the caller's user record, which bumps.
        - DynamoDBCrudPolicy:
            TableName: !Ref DataVersionTable
        - CloudWatchPutMetricPolicy: {}
      Events:
        GetUser:
          Type: Api
          Properties:
            Path: /user
            Method: GET
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer

  GetUserFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref GetUserFunction]]
      RetentionInDays: 30
