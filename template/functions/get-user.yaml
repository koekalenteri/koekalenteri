  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/GetUserFunction
      Handler: handler.default
      Policies:
        # dataVersions reads the version registry instead of scanning the collection tables; the
        # bump a changed user record causes comes with AuthorizePolicy.
        - DynamoDBReadPolicy:
            TableName: !Ref DataVersionTable
        - !Ref AuthorizePolicy
        - CloudWatchPutMetricPolicy: {}
      Events:
        GetUser:
          Type: Api
          Properties:
            Path: /user
            Method: GET
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer

  # GET /user once ran at ~11.5 req/s for five hours before anyone noticed, which was 64% of all
  # Lambda invocations for the period. Normal traffic is one call per token-refresh cycle per
  # user. The method throttle (api.yaml) still lets 5 req/s through, 18 000 an hour, so a flood
  # keeps the function's own invocation count far above the threshold even while the throttle
  # rejects the rest. AWS/Lambda Invocations is free; API Gateway's per-method Count would need
  # the detailed metrics, five billed series per method (KOE-1649).
  GetUserRequestFloodAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsNotTestStage
    Properties:
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic
      AlarmDescription: GET /user invocations are far above normal use
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref GetUserFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
