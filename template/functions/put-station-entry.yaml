  PutStationEntryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PutStationEntryFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:secretsmanager:${RegistrationEditTokenSecret}:SecretString}}'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - CloudWatchPutMetricPolicy: {}
        - !Ref WebSocketPolicy
      Events:
        PutStationEntry:
          Type: Api
          Properties:
            Path: /station-entry/{eventId}/{stationId}
            Method: POST
            RestApiId: !Ref KoekalenteriApi
