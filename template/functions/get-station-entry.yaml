  GetStationEntryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/GetStationEntryFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:secretsmanager:${RegistrationEditTokenSecret}:SecretString}}'
      Layers:
        - !Ref DependenciesLayer
      Tracing: PassThrough
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventRegistrationTable
        - CloudWatchPutMetricPolicy: {}
      Events:
        GetStationEntry:
          Type: Api
          Properties:
            Path: /station-entry/{eventId}/{stationId}
            Method: GET
            RestApiId: !Ref KoekalenteriApi

  GetStationEntryFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref GetStationEntryFunction]]
      RetentionInDays: 30
