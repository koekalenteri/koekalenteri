  GetDogFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/GetDogFunction
      Handler: handler.default
      Policies:
        - !Ref KLAPIParametersPolicy
        - CloudWatchPutMetricPolicy: {}
        - DynamoDBCrudPolicy:
            TableName: !Ref DogTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventTypeTable
      Events:
        GetDog:
          Type: Api
          Properties:
            Path: /dog/{regNo}
            Method: GET
            RestApiId: !Ref KoekalenteriApi
