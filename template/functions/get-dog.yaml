  GetDogFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/GetDogFunction
      Handler: handler.default
      Policies:
        - Statement:
            - Sid: SSMGetParameterPolicy
              Effect: Allow
              Action:
              - ssm:GetParameters
              - ssm:GetParameter
              Resource: '*'
        - CloudWatchPutMetricPolicy: {}
        - DynamoDBCrudPolicy:
            TableName: !Ref DogTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventTypeTable
      Events:
        GetDog:
          Type: Api
          Properties:
            Path: /dog/{regNo}
            Method: GET
            RestApiId: !Ref KoekalenteriApi
