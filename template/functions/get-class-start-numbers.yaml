  GetClassStartNumbersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/GetClassStartNumbersFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:secretsmanager:${RegistrationEditTokenSecret}:SecretString}}'
      Layers:
        - !Ref DependenciesLayer
      Tracing: PassThrough
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventRegistrationTable
        - CloudWatchPutMetricPolicy: {}
      Events:
        GetClassStartNumbers:
          Type: Api
          Properties:
            Path: /start-numbers/{eventId}/{eventClass}
            Method: GET
            RestApiId: !Ref KoekalenteriApi

  GetClassStartNumbersFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref GetClassStartNumbersFunction]]
      RetentionInDays: 30
