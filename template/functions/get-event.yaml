  GetEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/GetEventFunction
      Handler: handler.default
      Tracing: PassThrough
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - CloudWatchPutMetricPolicy: {}
      Events:
        GetEvent:
          Type: Api
          Properties:
            Path: /event/{id}
            Method: GET
            RestApiId: !Ref KoekalenteriApi
