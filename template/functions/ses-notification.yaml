  SesNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Join ['-', [ses-notifications, !Ref AWS::StackName]]

  SesNotificationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SesNotificationsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSesPublish
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SesNotificationsTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  SesConfigurationSetEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: Koekalenteri
      EventDestination:
        Enabled: true
        MatchingEventTypes:
          - bounce
          - complaint
        Name: !Join ['-', [ses-notifications, !Ref AWS::StackName]]
        SnsDestination:
          TopicARN: !Ref SesNotificationsTopic

  SesNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/SesNotificationFunction
      Handler: handler.default
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBWritePolicy:
            TableName: !Ref EmailSuppressionTable
        - DynamoDBWritePolicy:
            TableName: !Ref AuditTable
        # The bounce is matched to its event before the status is stored on the registration.
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        # The stored delivery status is broadcast to the event's organizer.
        - !Ref WebSocketPolicy
        - CloudWatchPutMetricPolicy: {}
      Events:
        SesNotification:
          Type: SNS
          Properties:
            Topic: !Ref SesNotificationsTopic
