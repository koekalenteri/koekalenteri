  GetEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/GetEventsFunction
      Handler: handler.default
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - CloudWatchPutMetricPolicy: {}
      Events:
        GetEvents:
          Type: Api
          Properties:
            Path: /event
            Method: GET
            RestApiId: !Ref KoekalenteriApi
