  PutUserNameFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PutUserNameFunction
      Handler: handler.default
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTable
        - CloudWatchPutMetricPolicy: {}
        - DynamoDBWritePolicy:
            TableName: !Ref DataVersionTable
        - !Ref AuthorizePolicy
        - !Ref WebSocketPolicy
      Events:
        PutUserName:
          Type: Api
          Properties:
            Path: /user/name
            Method: POST
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
