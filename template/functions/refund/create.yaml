  RefundCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/RefundCreateFunction
      Handler: handler.default
      Policies:
        - Statement:
            - Sid: SSMGetParameterPolicy
              Effect: Allow
              Action:
              - ssm:GetParameters
              - ssm:GetParameter
              Resource: '*'
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBReadPolicy:
            TableName: !Ref OrganizerTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - DynamoDBWritePolicy:
            TableName: !Ref AuditTable
        # Every audit row is streamed to the event's viewers (KOE-1340).
        - !Ref WebSocketPolicy
        - !Ref AuthorizePolicy
        - CloudWatchPutMetricPolicy: {}
      Events:
        PutEvent:
          Type: Api
          Properties:
            Path: /refund/create
            Method: POST
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer

  RefundCreateFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref RefundCreateFunction]]
      RetentionInDays: 180
