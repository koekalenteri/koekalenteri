  # Manual invoke only. Rebuilds every stats partition including ORG#, which registration
  # writes also maintain, so run it when writes are quiet. The nightly RebuildStatsFunction
  # covers the partitions that can be rebuilt safely at any time.
  RebuildAllStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/RebuildAllStatsFunction
      Handler: handler.default
      Layers:
        - !Ref DependenciesLayer
      Tracing: Active
      Timeout: 900
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventStatsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventRegistrationTable

  RebuildAllStatsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref RebuildAllStatsFunction]]
      RetentionInDays: 30
