  # Manual invoke only: rebuilds every stats partition, ORG# included; see src/lambda/lib/stats/README.md.
  RebuildAllStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/RebuildAllStatsFunction
      Handler: handler.default
      Timeout: 900
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventStatsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventRegistrationTable
