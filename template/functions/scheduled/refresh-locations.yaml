  # Weekly sync of the Kennelliitto municipality list. The list changes at the turn of the year, so
  # a weekly run is plenty; it writes only when the list actually differs, which is what keeps every
  # browser from refetching it. Also invokable manually for testing.
  RefreshLocationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/RefreshLocationsFunction
      Handler: handler.default
      Layers:
        - !Ref DependenciesLayer
      Tracing: Active
      Timeout: 300
      Policies:
        - Statement:
            - Sid: SSMGetParameterPolicy
              Effect: Allow
              Action:
                - ssm:GetParameters
                - ssm:GetParameter
              Resource: '*'
        - DynamoDBCrudPolicy:
            TableName: !Ref LocationTable
        - !Ref WebSocketPolicy
      Events:
        WeeklyRefresh:
          Type: ScheduleV2
          Properties:
            # Named after the stack: SAM otherwise derives the name from the logical IDs alone and
            # EventBridge Scheduler names are unique per account and region, so the first
            # environment to deploy would claim the name for every other one.
            Name: !Sub '${AWS::StackName}-refresh-locations-weekly'
            # 02:20 UTC on Sunday = 04:20/05:20 Helsinki, off the nightly stats rebuild's hour.
            ScheduleExpression: 'cron(20 2 ? * SUN *)'
            Description: Weekly refresh of the Kennelliitto municipality list
            State: ENABLED
            FlexibleTimeWindow:
              Mode: 'OFF'

  RefreshLocationsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref RefreshLocationsFunction]]
      RetentionInDays: 30

  RefreshLocationsFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Weekly Kennelliitto location refresh failed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RefreshLocationsFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # A sync that quietly stops running leaves the option list frozen with no other signal. One day
  # is the largest period CloudWatch accepts, so nine of them cover a missed weekly run.
  RefreshLocationsFunctionMissingRunAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Kennelliitto location refresh has not run in 9 days
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref RefreshLocationsFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 9
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
