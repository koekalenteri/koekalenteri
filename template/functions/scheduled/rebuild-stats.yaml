  # Nightly rebuild of every stats partition that has no other writer, also started after every deploy
  # (.github/workflows/release.yml); see src/lambda/lib/stats/README.md.
  RebuildStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/RebuildStatsFunction
      Handler: handler.default
      Timeout: 900
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventStatsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventRegistrationTable
      Events:
        # Renamed from NightlyRebuild: switching Schedule -> ScheduleV2 changes the underlying
        # resource type (AWS::Events::Rule -> AWS::Scheduler::Schedule), which CloudFormation
        # cannot update in place. A new logical ID makes it a create+delete instead.
        NightlyRebuildV2:
          Type: ScheduleV2
          Properties:
            # Named after the stack, because SAM otherwise derives the name from the logical IDs
            # alone (RebuildStatsFunction + NightlyRebuildV2) and EventBridge Scheduler names are
            # unique per account and region. Unnamed, the first environment to deploy claims the
            # name for the whole account and every later one fails to create it.
            Name: !Sub '${AWS::StackName}-rebuild-stats-nightly'
            # 01:00 UTC = 04:00 Helsinki in summer (EEST), 03:00 in winter (EET), outside registration hours.
            ScheduleExpression: 'cron(0 1 * * ? *)'
            Description: Nightly rebuild of participation, capacity, judge workload and event breakdown statistics
            State: ENABLED
            FlexibleTimeWindow:
              Mode: 'OFF'

  # A batch rebuild that stops running freezes the stats silently, which the incremental path
  # never did. Alarm on both outcomes: an erroring run, and no successful run in over 48h.
  RebuildStatsFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsNotTestStage
    Properties:
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic
      AlarmDescription: Stats rebuild failed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RebuildStatsFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  RebuildStatsFunctionMissingRunAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsNotTestStage
    Properties:
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic
      AlarmDescription: Nightly stats rebuild has not run successfully in 48 hours
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref RebuildStatsFunction
      Statistic: Sum
      Period: 172800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  # A registration the rebuild can't attribute to a capacity class (e.g. its class was renamed
  # or removed after entry) is otherwise silently dropped from the capacity charts with no
  # signal beyond the log line below. Unlike the alarms above, this doesn't fail the run.
  RebuildStatsFunctionUnattributedCapacityMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: RebuildStatsFunctionUnattributedCapacity
      FilterPattern: '"registrations it could not attribute to a capacity class"'
      LogGroupName: !Ref RebuildStatsFunctionLogGroup
      MetricTransformations:
        - MetricName: UnattributedCapacityRegistrations
          MetricNamespace: !Sub 'KoekalenteriApp/${AWS::StackName}'
          MetricValue: '1'

  RebuildStatsFunctionUnattributedCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsNotTestStage
    Properties:
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic
      AlarmDescription: Stats rebuild found registrations it could not attribute to a capacity class
      AlarmName: !Sub '${AWS::StackName}-rebuild-stats-unattributed-capacity'
      Namespace: !Sub 'KoekalenteriApp/${AWS::StackName}'
      MetricName: UnattributedCapacityRegistrations
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
