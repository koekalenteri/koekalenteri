  PaymentSuccessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PaymentSuccessFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:secretsmanager:${RegistrationEditTokenSecret}:SecretString}}'
      Layers:
        - !Ref DependenciesLayer
      Tracing: Active
      Policies:
        - Statement:
            - Sid: SSMGetParameterPolicy
              Effect: Allow
              Action:
              - ssm:GetParameters
              - ssm:GetParameter
              Resource: '*'
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventTable
        - DynamoDBReadPolicy:
            TableName: !Ref OrganizerTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - CloudWatchPutMetricPolicy: {}
        - Statement:
            - Sid: SESSendEmailPolicy
              Effect: Allow
              Action:
              - ses:sendTemplatedEmail
              Resource: '*'
        - !Ref WebSocketPolicy
      Events:
        PutEvent:
          Type: Api
          Properties:
            Path: /payment/success
            Method: GET
            RestApiId: !Ref KoekalenteriApi

  PaymentSuccessFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref PaymentSuccessFunction]]
      RetentionInDays: 180

  PaymentSuccessRegistrationPaymentsLockConflictMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: PaymentSuccessRegistrationPaymentsLockConflict
      FilterPattern: '"Registration payments are being updated. Please retry."'
      LogGroupName: !Ref PaymentSuccessFunctionLogGroup
      MetricTransformations:
        - MetricName: PaymentSuccessRegistrationPaymentsLockConflict
          MetricNamespace: KoekalenteriApp
          MetricValue: '1'

  PaymentSuccessRegistrationPaymentsLockConflictAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      # TODO: Add AlarmActions when the stack has a general operations SNS topic.
      AlarmDescription: A captured payment exhausted the event payment-lock retry budget and may be unapplied
      AlarmName: !Sub '${AWS::StackName}-payment-success-payment-lock-conflict'
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      MetricName: PaymentSuccessRegistrationPaymentsLockConflict
      Namespace: KoekalenteriApp
      Period: 60
      Statistic: Sum
      Threshold: 1
      TreatMissingData: notBreaching
