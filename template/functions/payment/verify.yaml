  PaymentVerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PaymentVerifyFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:ssm:${AWS::StackName}-REGISTRATION_EDIT_TOKEN_SECRET}}'
      Policies:
        - Statement:
            - Sid: SSMGetParameterPolicy
              Effect: Allow
              Action:
              - ssm:GetParameters
              - ssm:GetParameter
              Resource: '*'
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - DynamoDBWritePolicy:
            TableName: !Ref AuditTable
        # Every audit row is streamed to the event's viewers, and a settled failure is broadcast (KOE-1529).
        - !Ref WebSocketPolicy
        - CloudWatchPutMetricPolicy: {}
      Events:
        PutEvent:
          Type: Api
          Properties:
            Path: /payment/verify
            Method: POST
            RestApiId: !Ref KoekalenteriApi

  PaymentVerifyFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref PaymentVerifyFunction]]
      RetentionInDays: 180
