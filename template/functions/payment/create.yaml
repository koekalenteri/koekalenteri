  PaymentCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PaymentCreateFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:secretsmanager:${RegistrationEditTokenSecret}:SecretString}}'
      Policies:
        - Statement:
            - Sid: SSMGetParameterPolicy
              Effect: Allow
              Action:
              - ssm:GetParameters
              - ssm:GetParameter
              Resource: '*'
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBReadPolicy:
            TableName: !Ref OrganizerTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        # The logged-in route resolves the calling user (KOE-1418).
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserLinkTable
        - CloudWatchPutMetricPolicy: {}
      Events:
        PutEvent:
          Type: Api
          Properties:
            Path: /payment/create
            Method: POST
            RestApiId: !Ref KoekalenteriApi
        # The same handler for a logged-in participant, named by the authorizer (KOE-1418).
        PutUserEvent:
          Type: Api
          Properties:
            Path: /user/payment/create
            Method: POST
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer

  PaymentCreateFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref PaymentCreateFunction]]
      RetentionInDays: 180
