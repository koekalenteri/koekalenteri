  GetStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/GetStatsFunction
      Handler: handler.default
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventStatsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventTypeTable
      Events:
        StatsApi:
          Type: Api
          Properties:
            Path: /stats
            Method: GET
            RestApiId: !Ref KoekalenteriApi
