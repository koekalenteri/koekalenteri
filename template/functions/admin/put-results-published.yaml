  PutResultsPublishedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PutResultsPublishedFunction
      Handler: handler.default
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventTable
        # The public start list is rebuilt from the event's registrations once a day's results change.
        - DynamoDBReadPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBWritePolicy:
            TableName: !Ref AuditTable
        - !Ref AuthorizePolicy
        - CloudWatchPutMetricPolicy: {}
        - !Ref WebSocketPolicy
      Events:
        PutResultsPublished:
          Type: Api
          Properties:
            Path: /admin/results-published/{eventId}
            Method: PUT
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
