  RunMigrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/RunMigrationFunction
      Handler: handler.default
      # The deploy waits for the answer: a full scan and a write per modified row outlast the global 60 s.
      Timeout: 900
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventTable
        # The registration and dog rows hold calendar days too (KOE-1547).
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DogTable
        # The registry of applied migrations (collection `migrations`) lives in the version table.
        - DynamoDBCrudPolicy:
            TableName: !Ref DataVersionTable
        # The organizer repoint (KOE-1580): which ids the organizer table holds, and the roles on the
        # orphan ids.
        - DynamoDBReadPolicy:
            TableName: !Ref OrganizerTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
        - DynamoDBWritePolicy:
            TableName: !Ref UserTable
        # A first prize restored by the migration goes on the registration's audit trail, which is
        # pushed to the admins watching the event (KOE-1677).
        - DynamoDBWritePolicy:
            TableName: !Ref AuditTable
        - !Ref AuthorizePolicy
        - CloudWatchPutMetricPolicy: {}
        - !Ref WebSocketPolicy
      Events:
        RunMigration:
          Type: Api
          Properties:
            Path: /admin/migrate
            Method: POST
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
