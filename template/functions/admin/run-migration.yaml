  RunMigrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/RunMigrationFunction
      Handler: handler.default
      # The deploy waits for the answer: a full scan and a write per modified row outlast the global 60 s.
      Timeout: 900
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventTable
        # The registry of applied migrations (collection `migrations`) lives in the version table.
        - DynamoDBCrudPolicy:
            TableName: !Ref DataVersionTable
        # The organizer repoint (KOE-1580): which ids the organizer table holds, the stats that move
        # with a repointed event (a transaction with a Delete), and the roles on the orphan ids.
        - DynamoDBReadPolicy:
            TableName: !Ref OrganizerTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventStatsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
        - DynamoDBWritePolicy:
            TableName: !Ref UserTable
        - !Ref AuthorizePolicy
        - CloudWatchPutMetricPolicy: {}
      Events:
        RunMigration:
          Type: Api
          Properties:
            Path: /admin/migrate
            Method: POST
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
