  GetEventTypesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/GetEventTypesFunction
      Handler: handler.default
      Policies:
        - !Ref KLAPIParametersPolicy
        - CloudWatchPutMetricPolicy: {}
        - DynamoDBCrudPolicy:
            TableName: !Ref EventTypeTable
        - DynamoDBWritePolicy:
            TableName: !Ref DataVersionTable
        - !Ref AuthorizePolicy
        - !Ref WebSocketPolicy
      Events:
        GetEventTypes:
          Type: Api
          Properties:
            Path: /admin/eventType
            Method: GET
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
