  PutEventResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PutEventResultsFunction
      Handler: handler.default
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - DynamoDBWritePolicy:
            TableName: !Ref AuditTable
        - !Ref AuthorizePolicy
        - CloudWatchPutMetricPolicy: {}
        - !Ref WebSocketPolicy
      Events:
        PutEventResults:
          Type: Api
          Properties:
            Path: /admin/event-results/{eventId}
            Method: POST
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
