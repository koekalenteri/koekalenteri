  SendRegistrationMessagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/SendRegistrationMessagesFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:secretsmanager:${RegistrationEditTokenSecret}:SecretString}}'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
        - DynamoDBReadPolicy:
            TableName: !Ref TransactionTable
        - DynamoDBWritePolicy:
            TableName: !Ref AuditTable
        - !Ref AuthorizePolicy
        - CloudWatchPutMetricPolicy: {}
        - !Ref WebSocketPolicy
        - Statement:
            - Sid: SESSendEmailPolicy
              Effect: Allow
              Action:
              - ses:sendTemplatedEmail
              Resource: '*'
      Events:
        PutEmailTemplate:
          Type: Api
          Properties:
            Path: /admin/email-send
            Method: POST
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
