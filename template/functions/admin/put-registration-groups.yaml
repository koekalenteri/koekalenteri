  PutRegistrationGroupsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PutRegistrationGroupsFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:secretsmanager:${RegistrationEditTokenSecret}:SecretString}}'
      Layers:
        - !Ref CommonLayer
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserLinkTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - Statement:
            - Sid: SESSendEmailPolicy
              Effect: Allow
              Action:
              - ses:sendTemplatedEmail
              Resource: '*'
        - Statement:
            - Sid: SSMGetParameterPolicy
              Effect: Allow
              Action:
              - ssm:GetParameters
              - ssm:GetParameter
              Resource: '*'
        - CloudWatchPutMetricPolicy: {}
        - !Ref WebSocketPolicy
      Events:
        PutRegistrationGroups:
          Type: Api
          Properties:
            Path: /admin/reg-groups/{eventId}
            Method: POST
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer

  PutRegistrationGroupsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref PutRegistrationGroupsFunction]]
      RetentionInDays: 30

  PutRegistrationGroupsLockConflictMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: PutRegistrationGroupsLockConflict
      FilterPattern: '"Registration groups are being updated. Please retry."'
      LogGroupName: !Ref PutRegistrationGroupsFunctionLogGroup
      MetricTransformations:
        - MetricName: RegistrationGroupsLockConflict
          MetricNamespace: KoekalenteriApp
          MetricValue: '1'

  PutRegistrationGroupsLockConflictAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      # TODO: Add AlarmActions when the stack has a general operations SNS topic.
      AlarmDescription: Registration group updates exhausted the event group-lock retry budget
      AlarmName: !Sub '${AWS::StackName}-put-registration-groups-lock-conflict'
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      MetricName: RegistrationGroupsLockConflict
      Namespace: KoekalenteriApp
      Period: 60
      Statistic: Sum
      Threshold: 1
      TreatMissingData: notBreaching
