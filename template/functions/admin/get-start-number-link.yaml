  GetStartNumberLinkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/GetStartNumberLinkFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:ssm:${AWS::StackName}-REGISTRATION_EDIT_TOKEN_SECRET}}'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - !Ref AuthorizePolicy
        - CloudWatchPutMetricPolicy: {}
      Events:
        GetStartNumberLink:
          Type: Api
          Properties:
            Path: /admin/start-numbers-link/{eventId}/{eventClass}
            Method: GET
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
