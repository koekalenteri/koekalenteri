  GetLocationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/GetLocationsFunction
      Handler: handler.default
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref LocationTable
        # authorize() resolves the caller: the cognito link first, then the user record it points to.
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserLinkTable
        - CloudWatchPutMetricPolicy: {}
      Events:
        GetLocations:
          Type: Api
          Properties:
            Path: /admin/location
            Method: GET
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
