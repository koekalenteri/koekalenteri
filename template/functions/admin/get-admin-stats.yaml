  GetAdminStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/GetAdminStatsFunction
      Handler: handler.default
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventStatsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserLinkTable
      Events:
        GetAdminStatsApi:
          Type: Api
          Properties:
            Path: /admin/stats
            Method: GET
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
