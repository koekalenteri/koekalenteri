  GetRegistrationTransactionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/GetRegistrationTransactionsFunction
      Handler: handler.default
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionTable
        # A refresh that finds a payment failed settles it, which audits the registration (KOE-1529).
        - DynamoDBWritePolicy:
            TableName: !Ref AuditTable
        # The settled failure and its audit row are broadcast to the admins and the entrant (KOE-1529).
        - !Ref WebSocketPolicy
        - !Ref AuthorizePolicy
        - CloudWatchPutMetricPolicy: {}
        - Statement:
            - Sid: SSMGetParameterPolicy
              Effect: Allow
              Action:
                - ssm:GetParameters
                - ssm:GetParameter
              Resource: '*'
      Events:
        GetRegistrationTransactions:
          Type: Api
          Properties:
            Path: /admin/registration/transactions/{eventId}/{id}
            Method: GET
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
