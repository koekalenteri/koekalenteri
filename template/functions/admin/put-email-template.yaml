  PutEmailTemplateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PutEmailTemplateFunction
      Handler: handler.default
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmailTemplatesTable
        - CloudWatchPutMetricPolicy: {}
        - DynamoDBWritePolicy:
            TableName: !Ref DataVersionTable
        - !Ref AuthorizePolicy
        - !Ref WebSocketPolicy
        # CreateTemplate and UpdateTemplate take no resource type in IAM, so '*' is the only
        # resource they can have (KOE-1617).
        - Statement:
            - Sid: SESTemplatesPolicy
              Effect: Allow
              Action:
              - ses:CreateTemplate
              - ses:UpdateTemplate
              Resource: '*'
      Events:
        PutEmailTemplate:
          Type: Api
          Properties:
            Path: /admin/email-templates
            Method: POST
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
