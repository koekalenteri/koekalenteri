  PutAdminRegistrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PutAdminRegistrationFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:ssm:${AWS::StackName}-REGISTRATION_EDIT_TOKEN_SECRET}}'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBReadPolicy:
            TableName: !Ref EmailSuppressionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventTable
        - DynamoDBWritePolicy:
            TableName: !Ref AuditTable
        - DynamoDBWritePolicy:
            TableName: !Ref EventStatsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
        # The entrant's payment picture after a secretary's edit reads the open payments (KOE-1553).
        - DynamoDBReadPolicy:
            TableName: !Ref TransactionTable
        - !Ref AuthorizePolicy
        - CloudWatchPutMetricPolicy: {}
        - Statement:
            - Sid: SESSendEmailPolicy
              Effect: Allow
              Action:
              - ses:sendTemplatedEmail
              Resource: '*'
        - Statement:
            - Sid: SSMGetParameterPolicy
              Effect: Allow
              Action:
              - ssm:GetParameters
              - ssm:GetParameter
              Resource: '*'
        - !Ref WebSocketPolicy
      Events:
        PutAdminRegistration:
          Type: Api
          Properties:
            Path: /admin/registration
            Method: POST
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
        PatchAdminRegistration:
          Type: Api
          Properties:
            Path: /admin/registration
            Method: PATCH
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer

  PutAdminRegistrationPaymentsLockConflictMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: PutAdminRegistrationPaymentsLockConflict
      FilterPattern: '"Registration payments are being updated. Please retry."'
      LogGroupName: !Ref PutAdminRegistrationFunctionLogGroup
      MetricTransformations:
        - MetricName: AdminRegistrationPaymentsLockConflict
          MetricNamespace: KoekalenteriApp
          MetricValue: '1'

  PutAdminRegistrationPaymentsLockConflictAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsNotTestStage
    Properties:
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic
      AlarmDescription: Admin registration creates exhausted the event payment-lock retry budget
      AlarmName: !Sub '${AWS::StackName}-put-admin-registration-payment-lock-conflict'
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      MetricName: AdminRegistrationPaymentsLockConflict
      Namespace: KoekalenteriApp
      Period: 60
      Statistic: Sum
      Threshold: 1
      TreatMissingData: notBreaching
