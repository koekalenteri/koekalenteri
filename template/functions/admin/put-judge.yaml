  PutJudgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PutJudgeFunction
      Handler: handler.default
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref JudgeTable
        - CloudWatchPutMetricPolicy: {}
        - DynamoDBWritePolicy:
            TableName: !Ref DataVersionTable
        - !Ref AuthorizePolicy
        - !Ref WebSocketPolicy
      Events:
        PutJudge:
          Type: Api
          Properties:
            Path: /admin/judge
            Method: POST
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
