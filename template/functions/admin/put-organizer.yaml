  PutOrganizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PutOrganizerFunction
      Handler: handler.default
      Policies:
        - Statement:
            - Sid: SSMGetParameterPolicy
              Effect: Allow
              Action:
              - ssm:GetParameters
              - ssm:GetParameter
              Resource: '*'
        - DynamoDBCrudPolicy:
            TableName: !Ref OrganizerTable
        # Telling the admin clients the organizers changed bumps the collection's version.
        - DynamoDBWritePolicy:
            TableName: !Ref DataVersionTable
        - !Ref AuthorizePolicy
        - CloudWatchPutMetricPolicy: {}
        - !Ref WebSocketPolicy
      Events:
        PutOrganizer:
          Type: Api
          Properties:
            Path: /admin/organizer
            Method: POST
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
