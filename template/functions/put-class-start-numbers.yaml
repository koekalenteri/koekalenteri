  PutClassStartNumbersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PutClassStartNumbersFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:secretsmanager:${RegistrationEditTokenSecret}:SecretString}}'
      Layers:
        - !Ref DependenciesLayer
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRegistrationTable
        # The draw takes the event's registration groups lock, which is written onto the event row.
        - DynamoDBCrudPolicy:
            TableName: !Ref EventTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - CloudWatchPutMetricPolicy: {}
        - !Ref WebSocketPolicy
      Events:
        PutClassStartNumbers:
          Type: Api
          Properties:
            Path: /start-numbers/{eventId}/{eventClass}
            Method: POST
            RestApiId: !Ref KoekalenteriApi

  PutClassStartNumbersFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref PutClassStartNumbersFunction]]
      RetentionInDays: 30
