  PutRegistrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PutRegistrationFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:secretsmanager:${RegistrationEditTokenSecret}:SecretString}}'
      Layers:
        - !Ref DependenciesLayer
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBReadPolicy:
            TableName: !Ref EmailSuppressionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventStatsTable
        - CloudWatchPutMetricPolicy: {}
        - Statement:
            - Sid: SESSendEmailPolicy
              Effect: Allow
              Action:
              - ses:sendTemplatedEmail
              Resource: '*'
        - Statement:
            - Sid: SSMGetParameterPolicy
              Effect: Allow
              Action:
              - ssm:GetParameters
              - ssm:GetParameter
              Resource: '*'
        - !Ref WebSocketPolicy
      Events:
        PutRegistration:
          Type: Api
          Properties:
            Path: /registration
            Method: POST
            RestApiId: !Ref KoekalenteriApi
        PatchRegistration:
          Type: Api
          Properties:
            Path: /registration
            Method: PATCH
            RestApiId: !Ref KoekalenteriApi

  PutRegistrationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref PutRegistrationFunction]]
      RetentionInDays: 30

  PutRegistrationPaymentsLockConflictMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: PutRegistrationPaymentsLockConflict
      FilterPattern: '"Registration payments are being updated. Please retry."'
      LogGroupName: !Ref PutRegistrationFunctionLogGroup
      MetricTransformations:
        - MetricName: RegistrationPaymentsLockConflict
          MetricNamespace: KoekalenteriApp
          MetricValue: '1'

  PutRegistrationPaymentsLockConflictAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      # TODO: Add AlarmActions when the stack has a general operations SNS topic.
      AlarmDescription: Ready-registration creates exhausted the event payment-lock retry budget
      AlarmName: !Sub '${AWS::StackName}-put-registration-payment-lock-conflict'
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      MetricName: RegistrationPaymentsLockConflict
      Namespace: KoekalenteriApp
      Period: 60
      Statistic: Sum
      Threshold: 1
      TreatMissingData: notBreaching
