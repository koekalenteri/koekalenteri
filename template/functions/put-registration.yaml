  PutRegistrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PutRegistrationFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:secretsmanager:${RegistrationEditTokenSecret}:SecretString}}'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBReadPolicy:
            TableName: !Ref EmailSuppressionTable
        # The dog's official results are read from here, not taken from the request (KOE-1346).
        - DynamoDBReadPolicy:
            TableName: !Ref DogTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventStatsTable
        # The logged-in route resolves the calling user (KOE-1418).
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserLinkTable
        - CloudWatchPutMetricPolicy: {}
        - Statement:
            - Sid: SESSendEmailPolicy
              Effect: Allow
              Action:
              - ses:sendTemplatedEmail
              Resource: '*'
        - Statement:
            - Sid: SSMGetParameterPolicy
              Effect: Allow
              Action:
              - ssm:GetParameters
              - ssm:GetParameter
              Resource: '*'
        - !Ref WebSocketPolicy
      Events:
        PutRegistration:
          Type: Api
          Properties:
            Path: /registration
            Method: POST
            RestApiId: !Ref KoekalenteriApi
        PatchRegistration:
          Type: Api
          Properties:
            Path: /registration
            Method: PATCH
            RestApiId: !Ref KoekalenteriApi
        # The same handler for a logged-in participant: the authorizer names them, and the edit
        # token travels in X-Registration-Token since Authorization carries the id token (KOE-1418).
        PutUserRegistration:
          Type: Api
          Properties:
            Path: /user/registration
            Method: POST
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer
        PatchUserRegistration:
          Type: Api
          Properties:
            Path: /user/registration
            Method: PATCH
            RestApiId: !Ref KoekalenteriApi
            Auth:
              Authorizer: CognitoAuthorizer

  PutRegistrationPaymentsLockConflictMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: PutRegistrationPaymentsLockConflict
      FilterPattern: '"Registration payments are being updated. Please retry."'
      LogGroupName: !Ref PutRegistrationFunctionLogGroup
      MetricTransformations:
        - MetricName: RegistrationPaymentsLockConflict
          MetricNamespace: KoekalenteriApp
          MetricValue: '1'

  PutRegistrationPaymentsLockConflictAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      # TODO: Add AlarmActions when the stack has a general operations SNS topic.
      AlarmDescription: Ready-registration creates exhausted the event payment-lock retry budget
      AlarmName: !Sub '${AWS::StackName}-put-registration-payment-lock-conflict'
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      MetricName: RegistrationPaymentsLockConflict
      Namespace: KoekalenteriApp
      Period: 60
      Statistic: Sum
      Threshold: 1
      TreatMissingData: notBreaching
