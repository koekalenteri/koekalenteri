  PutStationEntryTurnFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/PutStationEntryTurnFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:secretsmanager:${RegistrationEditTokenSecret}:SecretString}}'
      Layers:
        - !Ref DependenciesLayer
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventRegistrationTable
        - CloudWatchPutMetricPolicy: {}
        - !Ref WebSocketPolicy
      Events:
        PutStationEntryTurn:
          Type: Api
          Properties:
            Path: /station-entry/{eventId}/{stationId}/turn
            Method: POST
            RestApiId: !Ref KoekalenteriApi

  PutStationEntryTurnFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref PutStationEntryTurnFunction]]
      RetentionInDays: 30
