  WsMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/WsMessageFunction
      Handler: handler.default
      Environment:
        Variables:
          REGISTRATION_EDIT_TOKEN_SECRET: !Sub '{{resolve:secretsmanager:${RegistrationEditTokenSecret}:SecretString}}'
      Layers:
        - !Ref DependenciesLayer
      Tracing: PassThrough
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WsConnectionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventRegistrationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserLinkTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTable
        - !Ref WebSocketPolicy

  MessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
        - { LambdaArn: !GetAtt WsMessageFunction.Arn }

  # Without a route response API Gateway discards whatever the integration returns, so every
  # acknowledgement the client waits for -- authenticate, the 401/403 refusal, the participant's
  # initial registration state -- was silently dropped. See KOE-1251.
  MessageDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      RouteResponseSelectionExpression: $default
      Target: !Sub integrations/${MessageIntegration}

  MessageDefaultRouteResponse:
    Type: AWS::ApiGatewayV2::RouteResponse
    Properties:
      ApiId: !Ref WebSocketApi
      RouteId: !Ref MessageDefaultRoute
      RouteResponseKey: $default

  MessagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WsMessageFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$default

  WsMessageFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref WsMessageFunction]]
      RetentionInDays: 30
