  # Cognito declaration
  KoekalenteriUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserPoolName: !Sub 'KoekalenteriUsers-${AWS::StackName}'
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      # Verification codes must come from the SES domain identity, not from an
      # address on snj.fi: only koekalenteri.snj.fi has DKIM signing and a custom
      # MAIL FROM, so only it produces a DMARC-aligned message. Sending from
      # snj.fi left the codes unauthenticated and they landed in spam (KOE-1122).
      # This block also has to stay here rather than being set in the console:
      # Cognito replaces the whole pool on update, so an unrelated change to this
      # resource would silently revert sending to Cognito's shared address and its
      # 50 messages per day cap.
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        SourceArn: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/koekalenteri.snj.fi'
        From: 'Koekalenteri <koekalenteri@koekalenteri.snj.fi>'
        ReplyToEmailAddress: 'koekalenteri@snj.fi'
        # Separate from the 'Koekalenteri' set on purpose: sign-up bounces must not
        # feed the registration email suppression table.
        ConfigurationSet: UserPool

  KoekalanteriUserPoolGoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      AttributeMapping:
        email_verified: "email_verified"
        name: "name"
        email: "email"
        username: "sub"
      IdpIdentifiers:
        - String
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile"
      ProviderName: "Google"
      ProviderType: "Google"
      UserPoolId: !Ref KoekalenteriUserPool

  KoekalenteriUserPoolTokenClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref KoekalenteriUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      # The frontend uses the code flow (responseType: 'code'); the implicit flow
      # is deprecated and leaks tokens via URL fragments, so it stays disabled.
      AllowedOAuthFlows: ['code']
      CallbackURLs: ['http://localhost:3000/login', !Join ['', ['https://', !GetAtt AmplifyBranch.BranchName, '.', !GetAtt AmplifyApp.DefaultDomain, '/login']], !Join ['', ['https://', !Ref CustomDomain, '/login']]]
      LogoutURLs: ['http://localhost:3000/logout', !Join ['', ['https://', !GetAtt AmplifyBranch.BranchName, '.', !GetAtt AmplifyApp.DefaultDomain, '/logout']], !Join ['', ['https://', !Ref CustomDomain, '/logout']]]
      SupportedIdentityProviders: ['COGNITO', 'Google']
      AllowedOAuthScopes: ['email', 'openid', 'profile']
      ExplicitAuthFlows:
      - USER_PASSWORD_AUTH

  KoekalenteriDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Join ['-', [!Ref CognitoDomainName, !Ref AWS::StackName]]
      UserPoolId: !Ref KoekalenteriUserPool

  KoekalenteriIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      AllowClassicFlow: false
      AllowUnauthenticatedIdentities: false
      IdentityPoolName: !Sub 'KoekalenteriIdentity-${AWS::StackName}'
