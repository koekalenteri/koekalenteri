  AmplifyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - amplify.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: Amplify
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: "amplify:*"
                Resource: "*"

  AmplifyApp:
    Type: "AWS::Amplify::App"
    Properties:
      Name: !Join ['-', [Koekalenteri, !Ref AWS::StackName]]
      Repository: !Ref Repository
      Description: Koekalenteri
      OauthToken: !Ref OauthToken
      BuildSpec: |-
        version: 0.1
        frontend:
          phases:
            build:
              commands:
                - npm ci
                - npm run build-frontend
          artifacts:
            baseDirectory: build
            files:
              - '**/*'
      # The build image is an app-wide setting, so it is the one variable that belongs here; the
      # frontend's own configuration is per-branch and lives on AmplifyBranch below. It has to,
      # in fact: the Cognito client's callback URLs already reference this app, so referencing the
      # client back from here would close a dependency cycle (cfn-lint E3004).
      EnvironmentVariables:
        # Amplify's default image is older than the toolchain .nvmrc and engines name. Setting it
        # here rather than in the console is what makes the version reviewable and updatable in one
        # place -- an `nvm` call in the build spec is not the way, nvm is not on PATH in the image.
        - Name: _CUSTOM_IMAGE
          Value: node:24
      CustomHeaders: !Sub |-
        customHeaders:
          - pattern: '**'
            headers:
              - key: 'Content-Security-Policy'
                value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://resources.paytrail.com https://flagcdn.com; font-src 'self' data:; connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com wss://*.execute-api.${AWS::Region}.amazonaws.com https://*.auth.${AWS::Region}.amazoncognito.com https://*.koekalenteri.snj.fi https://cognito-idp.${AWS::Region}.amazonaws.com https://cognito-identity.${AWS::Region}.amazonaws.com https://sts.${AWS::Region}.amazonaws.com https://dataplane.rum.${AWS::Region}.amazonaws.com; form-action 'self' https:; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"
      CustomRules:
        - Source: "/.well-known/apple-developer-merchantid-domain-association"
          Status: "200"
          Target: "/well-known/apple-developer-merchantid-domain-association.txt"
        - Source: "</^((?!\\.(css|gif|ico|jpg|js|png|txt|svg|woff|webp|ttf|json|map)$).)*$/>"
          Status: "200"
          Target: "/index.html"
      Tags:
        - Key: Name
          Value: Koekalenteri
      IAMServiceRole: !GetAtt AmplifyRole.Arn

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      BranchName: !Ref Branch
      AppId: !GetAtt AmplifyApp.AppId
      Description: Amplify Console main branch
      EnableAutoBuild: false
      # Every variable the frontend build reads. CloudFormation replaces this list wholesale, so it
      # has to be complete: a variable left out here is not set for the build. What this stack creates
      # is referenced rather than copied, so a rebuilt API or user pool carries the value with it
      # instead of drifting from a console entry.
      EnvironmentVariables:
        - Name: REACT_APP_API_BASE_URL
          Value: !Sub "https://${KoekalenteriApi}.execute-api.${AWS::Region}.amazonaws.com/${StageNameParam}"
        - Name: REACT_APP_CLIENT_ID
          Value: !Ref KoekalenteriUserPoolTokenClient
        - Name: REACT_APP_IDENTITY_POOL_ID
          Value: !Ref KoekalenteriIdentityPool
        # The Cognito custom domain is created outside this stack. Prod alone has no stage suffix.
        - Name: REACT_APP_OAUTH_DOMAIN
          Value: !If [IsProdStage, auth.koekalenteri.snj.fi, !Sub 'auth-${StageNameParam}.koekalenteri.snj.fi']
        - Name: REACT_APP_REDIRECT_SIGNIN
          Value: !Sub 'https://${CustomDomain}/login'
        - Name: REACT_APP_REDIRECT_SIGNOUT
          Value: !Sub 'https://${CustomDomain}/logout'
        - Name: REACT_APP_REGION
          Value: !Ref AWS::Region
        - Name: REACT_APP_USER_POOL_ID
          Value: !Ref KoekalenteriUserPool
        # The trailing slash is part of the stored value: the client appends a path to it.
        - Name: REACT_APP_WS_API_URL
          Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageNameParam}/"
        - Name: REACT_APP_RUM_APPLICATION_ID
          Value: !GetAtt KoekalenteriRumAppMonitor.Id
        - Name: REACT_APP_RUM_ENDPOINT
          Value: !Sub 'https://dataplane.rum.${AWS::Region}.amazonaws.com'
        - Name: REACT_APP_RUM_IDENTITY_POOL_ID
          Value: !Ref RumIdentityPool
        - Name: REACT_APP_RUM_ROLE_ARN
          Value: !GetAtt RumGuestRole.Arn
      Tags:
        - Key: Name
          Value: koekalenteri-amplify-console
        - Key: Branch
          Value: !Ref Branch
