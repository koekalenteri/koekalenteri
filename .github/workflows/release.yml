name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      env:
        description: Environment to deploy
        required: true
        type: string
      deploy_backend:
        description: Deploy backend
        required: false
        default: true
        type: boolean
      deploy_frontend:
        description: Deploy frontend
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: write
  id-token: write # for the OIDC token the deploy role is assumed with

# One deploy per environment at a time (KOE-1502): the data migration step runs after `sam deploy`, and
# a second deploy starting under it would run its migrations against a stack the first one is still
# changing. The group is on the workflow, so one run holds it from `setup` to the last job; a job-level
# group could not be shared by deploy-backend and deploy-frontend without letting another run's backend
# slip between them. A workflow-level group cannot read job outputs, so the environment is worked out
# here from the same inputs the `setEnv` step reads: keep the two in step. The caller's own group in
# ci.yml (`deploy-dev-<ref>`) must not get this name, or the caller and the called workflow wait for
# each other. This group never cancels a running deploy, but GitHub lets only one run wait per group: a
# newer waiting run replaces an older waiting one, so of several deploys queued behind a running one
# only the last is deployed. Dev is the exception to "never cancelled": the deploy-dev job in ci.yml
# has its own group (`deploy-dev-<ref>`) with cancel-in-progress, so a newer push cancels a running dev
# deploy, the migration step included. The migration lambda then runs on to its end, but this run no
# longer waits for it.
concurrency:
  group: deploy-${{ inputs.env || ((github.event_name == 'workflow_dispatch' || github.event.release.prerelease) && 'test' || 'prod') }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.setEnv.outputs.env }}
      deploy_backend: ${{ steps.setScope.outputs.deploy_backend }}
      deploy_frontend: ${{ steps.setScope.outputs.deploy_frontend }}
    steps:
      - id: setEnv
        run: |
          if [[ -n "${{ inputs.env }}" ]]; then
            echo "env=${{ inputs.env }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "env=test" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            echo "env=test" >> $GITHUB_OUTPUT
          else
            echo "env=prod" >> $GITHUB_OUTPUT
          fi
      - id: setScope
        run: |
          DEPLOY_BACKEND="${{ inputs.deploy_backend }}"
          DEPLOY_FRONTEND="${{ inputs.deploy_frontend }}"
          echo "deploy_backend=${DEPLOY_BACKEND:-true}" >> $GITHUB_OUTPUT
          echo "deploy_frontend=${DEPLOY_FRONTEND:-true}" >> $GITHUB_OUTPUT
      # The release notes the version shipped with are the release's description too: one text,
      # written once in docs/fi/whats-new/<version>.md, not a second one typed into the form (KOE-1398).
      - uses: actions/checkout@v7
        if: ${{ github.event_name == 'release' }}
      - name: Describe the release from its notes
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          NOTES="docs/fi/whats-new/${TAG#v}.md"
          if [[ -f "$NOTES" ]]; then
            # The frontmatter is the file's own bookkeeping; the description starts after it.
            awk 'body { print } /^---$/ { if (++fences == 2) body = 1 }' "$NOTES" > release-notes.md
            gh release edit "$TAG" --notes-file release-notes.md
          else
            echo "::warning::no release notes at $NOTES; the description stays as it was written"
          fi

  deploy-backend:
    needs: [setup]
    if: ${{ needs.setup.outputs.deploy_backend == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.env }}
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache node_modules
        id: cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build
        run: npm run build-backend
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      # With the deploy role's ARN in the repository secrets, the job authenticates through GitHub's
      # OIDC federation and no long-lived key exists anywhere (KOE-1349; the role is
      # aws/github-deploy-role.yaml). Until the secret is set, the access key is used as before.
      - uses: aws-actions/configure-aws-credentials@v6
        if: ${{ env.AWS_DEPLOY_ROLE_ARN != '' }}
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/configure-aws-credentials@v6
        if: ${{ env.AWS_DEPLOY_ROLE_ARN == '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Configure variables
        shell: bash
        run: |
          if [[ "${{ needs.setup.outputs.env }}" == "prod" ]]; then
            echo "branch=release/prod" >> $GITHUB_ENV
          elif [[ "${{ needs.setup.outputs.env }}" == "dev" ]]; then
            echo "branch=main" >> $GITHUB_ENV
          else
            echo "branch=release/test" >> $GITHUB_ENV
          fi
          echo "environment=koekalenteri-${{ needs.setup.outputs.env }}" >> $GITHUB_ENV
          echo "stage=${{ needs.setup.outputs.env }}" >> $GITHUB_ENV
      - name: SAM Build
        run: |
          sam build --base-dir dist -t dist/template.yaml
      - name: SAM Deploy
        run: |
          # Create S3 Bucket to store code
          aws s3api head-bucket --bucket "${{ env.environment }}" 2>/dev/null \
            || aws s3 mb s3://${{ env.environment }}
          # Run SAM Deploy
          sam deploy --template-file .aws-sam/build/template.yaml \
            --stack-name ${{ env.environment }} \
            --s3-bucket ${{ env.environment }} \
            --parameter-overrides \
              'ParameterKey=StageNameParam,ParameterValue=${{ env.stage }} \
              ParameterKey=Repository,ParameterValue=https://github.com/${{ github.repository }} \
              ParameterKey=OauthToken,ParameterValue=${{ secrets.AWS_OAUTH_TOKEN }} \
              ParameterKey=GoogleClientId,ParameterValue=${{ secrets.GOOGLE_CLIENT_ID }} \
              ParameterKey=GoogleClientSecret,ParameterValue=${{ secrets.GOOGLE_CLIENT_SECRET }} \
              ParameterKey=CustomDomain,ParameterValue=${{ secrets.CUSTOM_DOMAIN }} \
              ParameterKey=Branch,ParameterValue=${{ env.branch }}' \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset --no-fail-on-empty-changeset
      # Data migrations (KOE-1502): the function applies the ones its registry does not list yet and
      # answers with their counters. The lambda wrapper turns a failure into a non-200 answer instead of
      # a function error, so the answer is checked here; a failed run fails the job and with it
      # deploy-frontend, which needs this job.
      - name: Run data migrations
        run: |
          function_name=$(aws cloudformation describe-stack-resource \
            --stack-name "${{ env.environment }}" \
            --logical-resource-id RunMigrationFunction \
            --query StackResourceDetail.PhysicalResourceId --output text)
          aws lambda invoke --function-name "$function_name" \
            --cli-binary-format raw-in-base64-out --cli-read-timeout 900 \
            --payload '{}' migration-result.json
          cat migration-result.json
          jq -e '.statusCode == 200' migration-result.json > /dev/null \
            || { echo "::error::Data migrations failed"; exit 1; }
          jq -r '.body | fromjson | if length == 0 then "No migrations pending" else .[] | "\(.name): \(.count) rows" end' migration-result.json

  deploy-frontend:
    # After the backend, never beside it: the Amplify build reads its configuration from environment
    # variables this stack owns (AmplifyBranch.EnvironmentVariables) and builds on the image the stack
    # pins, so a build started while the stack update is still running uses the previous values -- or,
    # the first time a variable moves, none at all. Running the two side by side is also what hid a
    # broken build spec for a whole commit: the build that introduced it ran against the old one.
    needs: [setup, deploy-backend]
    if: ${{ always() && !failure() && !cancelled() && needs.setup.outputs.deploy_frontend == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.env }}
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
    # What the smoke job expects the served page to be stamped with: the commit Amplify is asked to
    # build and its package.json version, not the commit that triggered this run (dev builds the
    # newest main).
    outputs:
      revision: ${{ steps.amplify.outputs.revision }}
      version: ${{ steps.amplify.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # With the deploy role's ARN in the repository secrets, the job authenticates through GitHub's
      # OIDC federation and no long-lived key exists anywhere (KOE-1349; the role is
      # aws/github-deploy-role.yaml). Until the secret is set, the access key is used as before.
      - uses: aws-actions/configure-aws-credentials@v6
        if: ${{ env.AWS_DEPLOY_ROLE_ARN != '' }}
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/configure-aws-credentials@v6
        if: ${{ env.AWS_DEPLOY_ROLE_ARN == '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to amplify
        id: amplify
        env:
          APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          ENV: ${{ needs.setup.outputs.env }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Configure Git
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"

          if [[ "$ENV" == "prod" ]]; then
            # Production release from tag to release/prod
            TAG="${{ github.event.release.tag_name }}"
            TARGET_BRANCH="release/prod"
            echo "Creating and force-pushing branch $TARGET_BRANCH from release tag $TAG"
            git checkout -B $TARGET_BRANCH $TAG
            git push https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }} $TARGET_BRANCH --force
          elif [[ "$ENV" == "dev" ]]; then
            # Dev deploys from main directly.
            TARGET_BRANCH="main"
            git fetch origin $TARGET_BRANCH
            git checkout -B $TARGET_BRANCH origin/$TARGET_BRANCH
          else
            # Test release by manual dispatch from any branch to release/test
            SOURCE_BRANCH="${{ github.ref_name }}"
            TARGET_BRANCH="release/test"
            echo "Force-pushing source branch $SOURCE_BRANCH to $TARGET_BRANCH"
            git checkout $SOURCE_BRANCH
            git push https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }} $SOURCE_BRANCH:$TARGET_BRANCH --force
          fi

          {
            echo "revision=$(git rev-parse HEAD)"
            echo "version=$(git show HEAD:package.json | jq -r .version)"
          } >> "$GITHUB_OUTPUT"

          echo "Starting Amplify job for branch $TARGET_BRANCH"
          JOB_ID=$(aws amplify start-job --app-id $APP_ID --branch-name $TARGET_BRANCH --job-type RELEASE --output json | jq -r .jobSummary.jobId)
          echo "Job started with ID: $JOB_ID"

          echo "Waiting for job to complete..."
          while true; do
            STATUS=$(aws amplify get-job --app-id $APP_ID --branch-name $TARGET_BRANCH --job-id $JOB_ID --output json | jq -r .job.summary.status)
            echo "Current job status: $STATUS"
            if [[ "$STATUS" == "SUCCEED" ]]; then
              break
            elif [[ "$STATUS" == "FAILED" || "$STATUS" == "CANCELLED" ]]; then
              echo "Job failed or was cancelled. See Amplify console for details."
              exit 1
            fi
            sleep 10
          done
          echo "Job completed successfully."

  # The deploy is done when the site answers, not when Amplify and CloudFormation say so (KOE-1368):
  # the front page must load and the public event list must answer, on every deploy of every
  # environment. A deploy that failed has its own red job, so this one does not run after it. When
  # this run built the frontend, the page must also carry that build's stamp (scripts/smoke-deploy.mjs
  # retries while the CDN catches up) and preconnect to this stack's API: a build that read the
  # previous stack's variables is caught here. A backend-only deploy built no page, so only the
  # answers are checked. On dev a red smoke fails deploy-dev in ci.yml, and jira-testable with it.
  smoke:
    needs: [setup, deploy-backend, deploy-frontend]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.env }}
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the dev check asks git whether a served commit follows the expected one
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: aws-actions/configure-aws-credentials@v6
        if: ${{ env.AWS_DEPLOY_ROLE_ARN != '' }}
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/configure-aws-credentials@v6
        if: ${{ env.AWS_DEPLOY_ROLE_ARN == '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Read the API URL from the stack
        id: stack
        env:
          STACK: koekalenteri-${{ needs.setup.outputs.env }}
        run: |
          api=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='KoekalenteriFunctionApi'].OutputValue" --output text)
          if [[ -z "$api" || "$api" == "None" ]]; then
            echo "::error::$STACK has no KoekalenteriFunctionApi output"
            exit 1
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
      - name: Smoke check
        env:
          API_URL: ${{ steps.stack.outputs.api }}
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
          DEPLOY_FRONTEND: ${{ needs.setup.outputs.deploy_frontend }}
          ENV: ${{ needs.setup.outputs.env }}
          EXPECT_REVISION: ${{ needs.deploy-frontend.outputs.revision }}
          EXPECT_VERSION: ${{ needs.deploy-frontend.outputs.version }}
        run: |
          args=(--url "https://$CUSTOM_DOMAIN/" --api "$API_URL")
          if [[ "$DEPLOY_FRONTEND" == "true" ]]; then
            args+=(--expect-version "$EXPECT_VERSION" --expect-revision "$EXPECT_REVISION" --expect-api "$API_URL")
            # main may have moved on between the deploy job's checkout and Amplify's clone
            if [[ "$ENV" == "dev" ]]; then
              args+=(--allow-descendant)
            fi
          fi
          node scripts/smoke-deploy.mjs "${args[@]}"

  # The public path through the test environment once a deploy there is up (KOE-1559): the front
  # page lists an event, its registration form opens and checks what is filled in. The run writes
  # its own event into the stack's event table first (e2e/remote/global-setup.ts) and deletes it
  # afterwards, here too whatever the outcome, so a failed or cancelled run leaves nothing in the
  # public list. The form is never sent, so nothing is stored and no mail goes out. Every deploy of
  # test runs it, the prerelease's and a dispatched branch's alike; dev and prod never do, dev
  # because it deploys on every push to main, prod because the run writes into the table.
  e2e:
    needs: [setup, smoke]
    if: ${{ !cancelled() && needs.smoke.result == 'success' && needs.setup.outputs.env == 'test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.setup.outputs.env }}
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache node_modules
        id: cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        if: ${{ env.AWS_DEPLOY_ROLE_ARN != '' }}
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/configure-aws-credentials@v6
        if: ${{ env.AWS_DEPLOY_ROLE_ARN == '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Read the event table from the stack
        id: stack
        env:
          STACK: koekalenteri-${{ needs.setup.outputs.env }}
        run: |
          table=$(aws cloudformation describe-stack-resource --stack-name "$STACK" \
            --logical-resource-id EventTable \
            --query StackResourceDetail.PhysicalResourceId --output text)
          echo "event_table=$table" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Test
        env:
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
          E2E_EVENT_TABLE: ${{ steps.stack.outputs.event_table }}
        run: E2E_BASE_URL="https://$CUSTOM_DOMAIN/" npm run test-e2e-remote
      - name: Delete the test events
        if: ${{ always() && steps.stack.outputs.event_table != '' }}
        env:
          E2E_EVENT_TABLE: ${{ steps.stack.outputs.event_table }}
        run: node e2e/remote/sweep.mjs
      - name: Summarize the tests
        if: always()
        run: node e2e/summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results/e2e
          retention-days: 7
