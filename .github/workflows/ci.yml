name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      e2e: ${{ steps.scope.outputs.e2e }}
      frontend: ${{ steps.scope.outputs.frontend }}
      # A push the merge queue has already tested skips the tests and goes straight to deploy-dev;
      # tested_run_id is that merge_group run, where sonar finds the coverage.
      tested: ${{ steps.scope.outputs.tested }}
      tested_run_id: ${{ steps.merge-queue-run.outputs.run-id }}
      stack: ${{ steps.stack.outputs.changed || 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history

      - name: Get base commit
        id: base-commit
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For PRs, output empty string as base is ignored anyway
            echo "sha=" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # For direct pushes, use the "before" SHA from the push event
            BEFORE_SHA="${{ github.event.before }}"
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              # If this is a new branch, compare with the default branch
              echo "sha=$(git merge-base origin/${{ github.event.repository.default_branch }} ${{ github.sha }})" >> "$GITHUB_OUTPUT"
            elif [[ "${{ github.event.forced }}" == "true" ]]; then
              # Force pushes often rewrite an existing commit. Comparing old tip..new tip
              # only shows what changed between the two versions of the commit, not the
              # whole rewritten commit. Use their common ancestor when available.
              if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null && BASE_SHA=$(git merge-base "$BEFORE_SHA" "${{ github.sha }}" 2>/dev/null); then
                echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
              else
                echo "sha=$(git rev-parse ${{ github.sha }}^)" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "sha=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
            fi
          else
            # For other events (like merge_group)
            echo "sha=$(git merge-base origin/main ${{ github.sha }})" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.base-commit.outputs.sha }}
          filters: |
            backend:
              - '.github/**'
              - 'scripts/**'
              - 'src/lambda/**'
              - 'src/i18n/**'
              - 'src/lib/**'
              - 'src/types/**'
              - 'template/**'
              - 'package-lock.json'
              - 'package.json'
              - 'tsconfig.json'
              - 'vitest.config.mts'
              - 'Makefile'
            frontend:
              - '.github/**'
              - 'scripts/**'
              - 'public/**'
              - 'docs/**'
              - 'src/!(lambda)/**'
              - 'template/amplify.yaml'
              - 'vitest.config.mts'
              - 'package-lock.json'
              - 'package.json'
              - 'tsconfig.json'
            e2e:
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'playwright.remote.config.ts'

      - name: Check previous main CI result
        id: previous-ci
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@v9
        with:
          script: |
            const currentRunId = context.runId
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: context.ref.replace('refs/heads/', ''),
              status: 'completed',
              per_page: 20,
            })

            const previousRun = data.workflow_runs.find((run) => run.id !== currentRunId)
            const previousFailed = Boolean(previousRun && previousRun.conclusion !== 'success')

            core.info(
              previousRun
                ? `Previous completed CI run ${previousRun.id} concluded with ${previousRun.conclusion}`
                : 'No previous completed CI run found'
            )
            core.setOutput('failed', String(previousFailed))

      # The merge queue tests the very commit that lands on main, so a push usually has a successful
      # merge_group run for its SHA. A push without one (the queue bypassed) is tested here.
      - name: Find the merge queue run of this commit
        id: merge-queue-run
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              event: 'merge_group',
              head_sha: context.sha,
              status: 'success',
              per_page: 1,
            })
            const run = data.workflow_runs[0]
            core.info(
              run
                ? `Merge queue run ${run.id} tested ${context.sha} successfully`
                : `No successful merge queue run for ${context.sha}`
            )
            core.setOutput('run-id', run ? String(run.id) : '')

      - name: Resolve build scope
        id: scope
        env:
          PREVIOUS_FAILED: ${{ steps.previous-ci.outputs.failed }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
          FILTER_E2E: ${{ steps.filter.outputs.e2e }}
          MERGE_QUEUE_RUN_ID: ${{ steps.merge-queue-run.outputs.run-id }}
        run: |
          if [[ "$PREVIOUS_FAILED" == "true" ]]; then
            echo "Previous main CI run was not successful; building both backend and frontend."
            {
              echo "backend=true"
              echo "frontend=true"
              echo "e2e=true"
              echo "tested=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "backend=$FILTER_BACKEND"
              echo "frontend=$FILTER_FRONTEND"
              echo "e2e=$FILTER_E2E"
            } >> "$GITHUB_OUTPUT"
            # The merge_group run compared against the main it was queued on, so its scope holds
            # this push's. After a failed main run the scope above is the full one, which the
            # merge queue did not test, so the tests run here.
            if [[ -n "$MERGE_QUEUE_RUN_ID" ]]; then
              echo "Merge queue run $MERGE_QUEUE_RUN_ID tested this commit; skipping the tests."
              echo "tested=true" >> "$GITHUB_OUTPUT"
            else
              echo "tested=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Whether deploy-dev's frontend build has to wait for its backend deploy: it does when the
      # backend deploy may change what the Amplify build reads from the stack (release.yml,
      # deploy-frontend). The comparison is with the commit dev's stack was last deployed from, not
      # with the previous push, so the changes of a push whose deploy failed, was cancelled or has
      # not finished yet still count. Unfinished runs are looked at too: a deploy-backend that
      # succeeded in a run cancelled afterwards has deployed the stack all the same.
      - name: Find the commit the dev stack was deployed from
        id: deployed-stack
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              per_page: 30,
            })
            for (const run of data.workflow_runs) {
              if (run.id === context.runId) continue
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              })
              const job = jobs.jobs.find((j) => j.name === 'deploy-dev / deploy-backend')
              if (job?.conclusion === 'success') {
                core.info(`dev stack last deployed by run ${run.id} from ${run.head_sha}`)
                core.setOutput('sha', run.head_sha)
                return
              }
            }
            core.info('no successful dev backend deploy among the last 30 runs')
            core.setOutput('sha', '')

      # The stack paths are everything the Amplify build can read from the stack: the templates
      # outside template/functions and template/tables (those define functions with their alarms and
      # log groups, and tables, none of which AmplifyApp or AmplifyBranch references), the scripts
      # that join them into one template, and release.yml, whose `sam deploy` sets the parameters the
      # branch variables are built from. With no deployed commit to compare with, the build waits.
      - name: Resolve whether the stack changes
        id: stack
        if: ${{ github.event_name == 'push' }}
        env:
          BASE: ${{ steps.deployed-stack.outputs.sha }}
          HEAD: ${{ github.sha }}
        run: |
          paths=(template ':!template/functions' ':!template/tables'
            scripts/build-template.mjs scripts/lambdaLogGroups.mjs .github/workflows/release.yml)
          if [[ -z "$BASE" ]] || ! git merge-base --is-ancestor "$BASE" "$HEAD" 2>/dev/null; then
            echo "No deployed ancestor to compare with; the stack counts as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif changed=$(git diff --name-only "$BASE" "$HEAD" -- "${paths[@]}") && [[ -z "$changed" ]]; then
            echo "The stack paths are as deployed from $BASE."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "The stack paths changed since $BASE:"
            echo "$changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci


  backend:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ needs.setup.outputs.backend == 'true' && needs.setup.outputs.tested != 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache node_modules
        id: cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build
        run: npm run build-backend
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - name: Validate SAM template
        run: sam validate --lint -t dist/template.yaml
      - name: Test
        run: npm run test-backend -- --coverage
      - name: Rename coverage
        run: |
          mkdir -p coverage
          # Vitest writes coverage to <repo>/coverage. Support the former location too
          # so the failure diagnostics remain useful for old cached workspaces.
          if [ -f src/lambda/coverage/lcov.info ]; then
            mv src/lambda/coverage/lcov.info coverage/lcov.info
          elif [ -f coverage/lcov.info ]; then
            echo "backend lcov already present at coverage/lcov.info"
          else
            echo "backend lcov.info not found in expected locations" >&2
            echo "Tried: src/lambda/coverage/lcov.info and coverage/lcov.info" >&2
            echo "Files under ./coverage (if any):" >&2
            ls -la coverage || true
            echo "Files under ./src/lambda/coverage (if any):" >&2
            ls -la src/lambda/coverage || true
            exit 1
          fi
      - name: Cache coverage report
        uses: actions/cache/save@v6
        with:
          path: coverage/lcov.info
          key: ${{ github.ref_name }}-backend-coverage-${{ github.run_id }}
      # A merge queue run's cache is under the queue's ref, out of main's reach; the push run that
      # skips the tests downloads this instead.
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage/lcov.info

  frontend:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ needs.setup.outputs.frontend == 'true' && needs.setup.outputs.tested != 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache node_modules
        id: cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      # The production build, with the browser tests' environment baked in: nothing deploys this
      # one (Amplify builds its own with the stack's), so it is built once here for the e2e shards.
      - name: Build
        run: npm run build-e2e-frontend
        env:
          SKIP_TYPECHECK: 'true' # the lint job type-checks the same sources
      # The post-deploy smoke check reads this stamp from the served page (KOE-1368); checking the
      # real minified build here means a template or minifier change cannot drop it unnoticed.
      - name: Check the build's version stamp
        run: |
          node scripts/smoke-deploy.mjs --html build-e2e/index.html \
            --expect-version "$(jq -r .version package.json)" --expect-revision "$(git rev-parse HEAD)"
      - name: Upload the build for the browser tests
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-build
          # stats.json is the bundle analyzer's, some 250 MB that the tests never read.
          path: |
            build-e2e
            !build-e2e/stats.json
          retention-days: 1

  frontend-test:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ needs.setup.outputs.frontend == 'true' && needs.setup.outputs.tested != 'true' }}
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install packages
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: npm ci
      # Runners differ in speed by some 1.6 times, enough to make one shard of the same files twice
      # as slow as another: this tells a slow machine from a slow shard.
      - name: Runner CPU
        run: grep -m1 'model name' /proc/cpuinfo
      - name: Test
        run: npm run test-frontend -- --coverage --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Rename coverage
        run: mv coverage/lcov.info coverage/lcov${{ matrix.shard }}.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-${{ matrix.shard }}
          path: coverage/lcov${{ matrix.shard }}.info

  visual-test:
    # Screenshot comparisons of components in a real browser. Reference images are per-platform, so
    # these only ever compare against the linux baselines committed under __screenshots__; a diff is
    # uploaded on failure so the change can be reviewed rather than guessed at.
    runs-on: ubuntu-latest
    # Off sonar's path, so it waits for a short job rather than take a runner from one on it.
    needs: [setup, integration]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.tested != 'true' && needs.setup.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install packages
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          # The browsers and the .deb files of the system packages they need, both fixed by the
          # Playwright version, so a lock change that leaves it alone still hits.
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-debs
          key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - name: Install Playwright chromium
        run: scripts/install-playwright-chromium.sh
      - name: Test
        run: npm run test-visual -- --run
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-screenshot-diffs
          # The actual and diff images vitest writes for a failed comparison; the references
          # themselves are in git, so uploading them would only repeat the checkout.
          path: .vitest-attachments/**
          # A dot-directory is hidden, and upload-artifact skips hidden files unless told not to.
          include-hidden-files: true
          retention-days: 7

  e2e-test:
    # Browser tests of the main paths (KOE-396): the production frontend build against the built
    # lambda bundles, called in-process by e2e/server, with DynamoDB-local as the only container and
    # SES, SSM and Paytrail faked on localhost. Playwright starts and stops the servers itself.
    # Sharded by test, one worker each. Off sonar's path, so it waits for the frontend job, whose
    # build it uses, rather than take runners from the jobs on it at the start.
    runs-on: ubuntu-latest
    needs: [setup, frontend]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.tested != 'true' && (needs.setup.outputs.frontend == 'true' || needs.setup.outputs.backend == 'true' || needs.setup.outputs.e2e == 'true') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install packages
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: npm ci
      - name: Runner CPU
        run: grep -m1 'model name' /proc/cpuinfo
      - name: Build backend
        run: npm run build-backend
      - name: Download the frontend build
        if: ${{ needs.frontend.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: frontend-e2e-build
          path: build-e2e
      # A change outside the frontend's scope skips the frontend job, and with it the build.
      - name: Build frontend
        if: ${{ needs.frontend.result != 'success' }}
        run: npm run build-e2e-frontend
        env:
          SKIP_TYPECHECK: 'true' # the lint job type-checks the same sources
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          # The browsers and the .deb files of the system packages they need, both fixed by the
          # Playwright version, so a lock change that leaves it alone still hits.
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-debs
          key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - name: Install Playwright chromium
        run: scripts/install-playwright-chromium.sh
      - name: Test
        run: npm run test-e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Summarize the tests
        if: always()
        run: node e2e/summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results/e2e
          retention-days: 7

  # Every lint in one job: the type-checks, biome and its ratchet once for all of src, the browser
  # tests' sources and TESTS.md, knip, and the guides. Nothing waits for it, and it waits for the
  # short frontend job so as not to take a runner from a job on sonar's path.
  lint:
    runs-on: ubuntu-latest
    needs: [setup, frontend]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.tested != 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install packages
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: npm ci
      - name: Type-check the frontend
        run: npm run lint-frontend
      - name: Type-check the backend
        run: npm run lint-backend
      - name: Biome
        run: npm run lint-biome
      - name: Ratchet
        run: npm run ratchet
      - name: Lint the browser tests
        run: npm run lint-e2e
      - name: Knip (unused files/exports/deps)
        run: npm run knip
      # The guides bind to the code: a control named by a translation key, a picture that is a visual
      # test's reference, a translation with its source's digest. A binding that no longer holds fails
      # here, before the guide reaches a reader (KOE-1397).
      - name: Check the guides
        run: npm run check-docs

  # The check the ruleset requires: every job that tests the change, under one name. A job skipped
  # for being out of the change's scope passes; one that failed, was cancelled or never ran fails it.
  tests:
    runs-on: ubuntu-latest
    needs: [setup, lint, backend, frontend, frontend-test, visual-test, e2e-test, integration]
    if: ${{ always() }}
    steps:
      - name: Check the jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '.setup.result == "success" and all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  integration:
    # The database layer against DynamoDB-local (KOE-1369): the tables are created from
    # template/tables, the same templates production is built from, so a query that names an index
    # or a key the template does not have fails here rather than in production. Not part of the
    # backend job: it needs the container, and nothing in it is covered by the unit tests' lcov.
    # The runner reads its table names and endpoint from e2e/env.mjs, hence the e2e scope too.
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ needs.setup.outputs.tested != 'true' && (needs.setup.outputs.backend == 'true' || needs.setup.outputs.e2e == 'true') }}
    timeout-minutes: 10
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install packages
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: npm ci
      - name: Test
        run: npm run test-integration

  frontend-coverage:
    runs-on: ubuntu-latest
    needs: [frontend-test]
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: frontend-coverage-*
          path: coverage
          merge-multiple: true
      - name: Cache frontend coverage reports
        uses: actions/cache/save@v6
        with:
          path: coverage
          key: ${{ github.ref_name }}-frontend-coverage-${{ github.run_id }}

  deploy-dev:
    needs: [setup, lint, backend, frontend, frontend-test, integration]
    if: ${{ always() && !failure() && !cancelled() && github.event_name == 'push' && (needs.setup.outputs.backend == 'true' || needs.setup.outputs.frontend == 'true') }}
    permissions:
      actions: read
      contents: write
      id-token: write # the called release workflow assumes the deploy role with it
    concurrency:
      group: deploy-dev-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/release.yml
    with:
      env: dev
      deploy_backend: ${{ needs.setup.outputs.backend == 'true' }}
      deploy_frontend: ${{ needs.setup.outputs.frontend == 'true' }}
      frontend_after_backend: ${{ needs.setup.outputs.stack != 'false' }}
    secrets: inherit

  # A pushed commit is only testable once it is deployed to dev, so this is where the named Jira
  # issues learn about it: a still-in-development issue moves to Ready for Testing, and every named
  # issue gets a comment listing the deployed commits (KOE-1218 testing feedback).
  jira-testable:
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    if: ${{ always() && needs.deploy-dev.result == 'success' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Issue keys are collected per pushed commit

      # github.event.before is the previous *push*, not the previous *successful run of this
      # job*. If deploy-dev failed on an intermediate push, this job never ran for it and its
      # commits' Jira keys would be silently skipped forever, even once a later push deploys
      # them too. Walk completed ci.yml runs on main and use the head_sha of the most recent
      # one where this job actually succeeded, so the next success always covers everything
      # since the last one that got through, however many pipelines failed in between.
      - name: Find the last commit this job successfully marked
        id: last-marked
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              status: 'completed',
              per_page: 30,
            })
            for (const run of data.workflow_runs) {
              if (run.id === context.runId) continue
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              })
              const job = jobs.jobs.find((j) => j.name === 'jira-testable')
              if (job?.conclusion === 'success') {
                core.info(`last successful jira-testable run: ${run.id} at ${run.head_sha}`)
                core.setOutput('sha', run.head_sha)
                return
              }
            }
            core.info('no previous successful jira-testable run found')
            core.setOutput('sha', '')

      - name: Mark the named Jira issues testable
        env:
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          BASE="${{ steps.last-marked.outputs.sha }}"
          if [[ -z "$BASE" ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse '${{ github.sha }}^')"
          fi
          node scripts/jira-mark-testable.mjs "$BASE" "${{ github.sha }}"

  sonar:
    runs-on: ubuntu-latest
    needs: [setup, backend, frontend-coverage]
    if: >-
      ${{
        always() &&
        !failure() &&
        !cancelled() &&
        github.event_name != 'merge_group' &&
        !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]')
      }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis (SonarCloud)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install packages
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: npm ci
      # A push the merge queue tested ran no tests of its own: the coverage is that merge_group run's.
      # It is saved under this ref too, so a later run that skips a side restores this commit's
      # coverage rather than one from before the merge queue runs. A side the merge_group run did not
      # test has no artifact, and falls back to the cache like any other run.
      - name: Download frontend coverage from the merge queue run
        if: ${{ needs.setup.outputs.tested == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: frontend-coverage-*
          path: coverage
          merge-multiple: true
          run-id: ${{ needs.setup.outputs.tested_run_id }}
          github-token: ${{ github.token }}
      - name: Cache the merge queue run's frontend coverage
        if: ${{ needs.setup.outputs.tested == 'true' && hashFiles('coverage/lcov*.info') != '' }}
        uses: actions/cache/save@v6
        with:
          path: coverage
          key: ${{ github.ref_name }}-frontend-coverage-${{ github.run_id }}
      - name: Download frontend coverage
        if: ${{ hashFiles('coverage/lcov*.info') == '' }}
        uses: actions/cache/restore@v6
        with:
          path: coverage
          key: ${{ github.ref_name }}-frontend-coverage
          restore-keys: ${{ github.ref_name }}-frontend-coverage
      - name: Download backend coverage from the merge queue run
        if: ${{ needs.setup.outputs.tested == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: backend-coverage
          path: coverage
          merge-multiple: true
          run-id: ${{ needs.setup.outputs.tested_run_id }}
          github-token: ${{ github.token }}
      - name: Cache the merge queue run's backend coverage
        if: ${{ needs.setup.outputs.tested == 'true' && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/cache/save@v6
        with:
          path: coverage/lcov.info
          key: ${{ github.ref_name }}-backend-coverage-${{ github.run_id }}
      - name: Download backend coverage
        if: ${{ hashFiles('coverage/lcov.info') == '' }}
        uses: actions/cache/restore@v6
        with:
          path: coverage/lcov.info
          key: ${{ github.ref_name }}-backend-coverage
          restore-keys: ${{ github.ref_name }}-backend-coverage
      - name: Read frontend version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1
      - name: Set version
        run: echo -e "\nsonar.projectVersion=${{ steps.package-version.outputs.current-version}}" >> sonar-project.properties
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
